<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro-Climatic GIS Map | TNAU Agri Portal</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,900,500,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/map.css">
    <!-- Leaflet & Routing CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <style>
        .map-hero {
            background-color: var(--color-primary-900);
            color: var(--color-white);
            padding: var(--space-8) 0;
            text-align: center;
        }
        .empty-state {
            text-align: center;
            padding: var(--space-16) var(--space-4);
            background-color: var(--color-white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-neutral-200);
            margin: var(--space-8) 0;
        }
        .toast-alert {
            position: fixed;
            bottom: var(--space-8);
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--color-danger-500, #ef4444);
            color: white;
            padding: var(--space-3) var(--space-6);
            border-radius: var(--radius-full);
            font-weight: 500;
            font-size: var(--text-sm);
            box-shadow: var(--shadow-lg);
            z-index: 9999;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: var(--space-2);
            pointer-events: none;
        }
        .toast-alert.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .search-suggestions {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(16px);
            border-radius: var(--radius-xl);
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
            border: 1px solid rgba(255,255,255,0.4);
            overflow: hidden;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-10px);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 350px;
            overflow-y: auto;
        }
        .search-suggestions.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .suggestion-item {
            padding: var(--space-3) var(--space-4);
            display: flex;
            align-items: center;
            gap: var(--space-3);
            cursor: pointer;
            transition: background 0.2s;
            color: var(--color-neutral-700);
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover {
            background: var(--color-primary-50);
            color: var(--color-primary-700);
        }
        .suggestion-icon {
            color: var(--color-primary-500);
            font-size: var(--text-lg);
            width: 24px;
            text-align: center;
        }
        .suggestion-content { flex: 1; }
        .suggestion-text { font-size: var(--text-sm); font-weight: 600; }
        .suggestion-subtext { font-size: var(--text-xs); color: var(--color-neutral-500); margin-top: 2px; }
    </style>
</head>
<body>
    <nav id="main-navbar"></nav>

    <main class="map-page">
        <!-- Floating Unified Search & Filter Header -->
        <div class="map-floating-search">
            <a href="index.html" class="map-back-link" title="Back to Home">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div style="position: relative;">
                <div class="search-bar-container">
                <i class="fa-solid fa-search search-icon" id="map-search-btn" style="cursor: pointer;" title="Search"></i>
                <div style="position: relative; flex: 1; display: flex; align-items: center; width: 100%;">
                    <input type="text" id="map-search-input" placeholder="Search Universities..." class="map-search-input" style="width: 100%; padding-right: 75px; box-sizing: border-box;">
                    <div style="position: absolute; right: 8px; display: flex; gap: 4px; z-index: 10;">
                        <button id="btn-nearest-college" style="background: var(--color-primary-50); border: none; color: var(--color-primary-600); cursor: pointer; width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: all 0.2s;" title="Find Nearest College">
                            <i class="fa-solid fa-location-arrow" style="font-size: 14px;"></i>
                        </button>
                        <button id="btn-submit-search" style="background: var(--color-primary-100); border: none; color: var(--color-primary-700); cursor: pointer; width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: all 0.2s;" title="Search">
                            <i class="fa-solid fa-arrow-right" style="font-size: 14px;"></i>
                        </button>
                    </div>
                </div>
                <div class="search-actions">
                    <button id="btn-get-location" class="icon-btn" title="Near Me"><i class="fa-solid fa-location-crosshairs"></i></button>
                    <div class="divider"></div>
                    <button id="btn-toggle-filters" class="icon-btn filter-toggle-btn" title="Filters"><i class="fa-solid fa-sliders"></i></button>
                </div>
            </div>
            <div id="search-suggestions" class="search-suggestions"></div>
        </div>
        </div>

        <!-- Pop-out Filter Panel -->
        <div id="filter-sidebar" class="filter-sidebar slide-hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4);">
                <div>
                    <h3 style="margin: 0; font-size: var(--text-lg);">Filters</h3>
                    <p style="font-size: var(--text-xs); color: var(--color-neutral-500); margin: 0;">Refine campus map view</p>
                </div>
                <button id="btn-close-filters" class="close-panel-btn" style="position: static;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="pill-filters" style="flex-wrap: wrap; overflow-x: visible;">
                <button class="pill-filter active" data-filter="all">All (99)</button>
                <button class="pill-filter" data-filter="isConstituent">Constituent (18)</button>
                <button class="pill-filter" data-filter="isAffiliated">Affiliated (28)</button>
                <button class="pill-filter" data-filter="isStation">Research Stations (38)</button>
                <button class="pill-filter" data-filter="isKvk">KVKs (15)</button>
                <button class="pill-filter" data-filter="hasTour">360° Tour</button>
                <button class="pill-filter" data-filter="zone-Western">Western Zone</button>
                <button class="pill-filter" data-filter="zone-Cauvery">Cauvery Delta</button>
                <button class="pill-filter" data-filter="zone-Southern">Southern Zone</button>
                <button class="pill-filter" data-filter="zone-NorthEastern">North Eastern</button>
                <button class="pill-filter" data-filter="zone-NorthWestern">North Western</button>
                <button class="pill-filter" data-filter="zone-HighRainfall">High Rainfall</button>
                <button class="pill-filter" data-filter="zone-Hilly">Hilly Zone</button>
            </div>
        </div>

        <!-- Detail Side Panel (Slides in when a pin is clicked) -->
        <aside id="detail-panel" class="detail-panel hidden">
            <button id="close-detail-panel" class="close-panel-btn"><i class="fa-solid fa-xmark"></i></button>
            <div class="detail-panel-cover" id="detail-cover-img"></div>
            <div class="detail-panel-content">
                <div class="detail-badge" id="detail-category">Category</div>
                <h2 id="detail-title">University Name</h2>
                <p id="detail-location" class="detail-location"><i class="fa-solid fa-location-dot"></i> Location</p>
                
                <div class="detail-stats">
                    <div class="stat-box">
                        <span class="stat-value" id="detail-naac">A++</span>
                        <span class="stat-label">NAAC Grade</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-value">Est.</span>
                        <span class="stat-label" id="detail-est">Year</span>
                    </div>
                </div>

                <div class="detail-actions">
                    <button id="btn-campus-mode" class="btn btn-primary btn-full"><i class="fa-solid fa-street-view"></i> Enter Campus Mode</button>
                    <button id="btn-plan-route" class="btn btn-outline btn-full"><i class="fa-solid fa-route"></i> Plan Route</button>
                    <a id="btn-view-profile" href="#" class="btn btn-text btn-full">View Full Profile</a>
                </div>
            </div>
        </aside>

        <!-- Exit Campus Mode Button -->
        <button id="btn-exit-campus" class="btn-exit-campus hidden"><i class="fa-solid fa-arrow-left"></i> Back to State Map</button>

        <!-- Map Container -->
        <div style="position: relative; width: 100%; height: 100%;">
            <div id="map" style="width: 100%; height: 100%;"></div>
            
            <div id="campus-layers-panel" class="map-controls-floating" style="display: none; position: absolute; top: var(--space-4); right: var(--space-4); z-index: 1000; background: rgba(255,255,255,0.95); backdrop-filter: blur(24px); padding: var(--space-5); border-radius: var(--radius-xl); box-shadow: var(--shadow-2xl); width: 280px;">
                <h4 style="margin-bottom: var(--space-4); font-size: var(--text-lg); border-bottom: 1px solid var(--color-neutral-200); padding-bottom: var(--space-2);">Campus Layers</h4>
                <div style="display: flex; gap: var(--space-3); flex-direction: column;">
                    <label class="toggle-switch">
                        <span class="toggle-label">Academic Blocks</span>
                        <input type="checkbox" checked onchange="toggleCampusLayer('academicBlocks', this.checked)">
                        <div class="toggle-slider"></div>
                    </label>
                    <label class="toggle-switch">
                        <span class="toggle-label">Admin Block</span>
                        <input type="checkbox" onchange="toggleCampusLayer('admin', this.checked)">
                        <div class="toggle-slider"></div>
                    </label>
                    <label class="toggle-switch">
                        <span class="toggle-label">Labs</span>
                        <input type="checkbox" onchange="toggleCampusLayer('labs', this.checked)">
                        <div class="toggle-slider"></div>
                    </label>
                    <label class="toggle-switch">
                        <span class="toggle-label">Library</span>
                        <input type="checkbox" onchange="toggleCampusLayer('library', this.checked)">
                        <div class="toggle-slider"></div>
                    </label>
                    <label class="toggle-switch">
                        <span class="toggle-label">Hostels</span>
                        <input type="checkbox" onchange="toggleCampusLayer('hostels', this.checked)">
                        <div class="toggle-slider"></div>
                    </label>
                    <label class="toggle-switch">
                        <span class="toggle-label">Sports</span>
                        <input type="checkbox" onchange="toggleCampusLayer('sports', this.checked)">
                        <div class="toggle-slider"></div>
                    </label>
                    <label class="toggle-switch">
                        <span class="toggle-label">Transport</span>
                        <input type="checkbox" onchange="toggleCampusLayer('transport', this.checked)">
                        <div class="toggle-slider"></div>
                    </label>
                    <label class="toggle-switch">
                        <span class="toggle-label">Canteen</span>
                        <input type="checkbox" onchange="toggleCampusLayer('canteen', this.checked)">
                        <div class="toggle-slider"></div>
                    </label>
                    <label class="toggle-switch">
                        <span class="toggle-label">Safety Points</span>
                        <input type="checkbox" onchange="toggleCampusLayer('safety', this.checked)">
                        <div class="toggle-slider"></div>
                    </label>
                    <label class="toggle-switch">
                        <span class="toggle-label">Green Spaces</span>
                        <input type="checkbox" onchange="toggleCampusLayer('greenSpaces', this.checked)">
                        <div class="toggle-slider"></div>
                    </label>
                    <label class="toggle-switch">
                        <span class="toggle-label">Accessibility</span>
                        <input type="checkbox" onchange="toggleCampusLayer('accessibility', this.checked)">
                        <div class="toggle-slider"></div>
                    </label>
                    <button class="btn btn-primary btn-full" style="margin-top: var(--space-4);" onclick="openRouteModal()"><i class="fa-solid fa-route"></i> Plan Route</button>
                </div>
            </div>
        </div>

        <style>
            dialog#route-modal::backdrop {
                background: rgba(0, 0, 0, 0.4);
                backdrop-filter: blur(4px);
            }
        </style>
        <dialog id="route-modal" style="margin: auto; padding: var(--space-6); border: none; border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); max-width: 400px; width: 100%;">
            <h3 style="margin-bottom: var(--space-2);">Plan Route</h3>
            <p style="color: var(--color-neutral-600); margin-bottom: var(--space-4);">Find the best route from your location to the campus.</p>
            <div id="route-results" style="margin-bottom: var(--space-4); font-size: var(--text-sm); color: var(--color-primary-600);"></div>
            <div style="display: flex; gap: var(--space-2);">
                <button class="btn btn-primary" onclick="calculateRoute()">Get Directions</button>
                <button class="btn" onclick="document.getElementById('route-modal').close()">Close</button>
            </div>
        </dialog>

        <!-- Floating Route Info Panel (Shows after route is calculated) -->
        <div id="route-info-panel" class="map-controls-floating" style="display: none; position: absolute; bottom: var(--space-4); right: var(--space-4); z-index: 1000; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); padding: var(--space-4); border-radius: var(--radius-lg); box-shadow: var(--shadow-2xl); width: 320px; transition: transform 0.4s, opacity 0.4s;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-2);">
                <h4 style="margin: 0;">Route Summary</h4>
                <button class="close-panel-btn" style="position: static; width: 24px; height: 24px;" onclick="clearRoute()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="route-info-content" style="font-size: var(--text-sm); margin-bottom: var(--space-3); color: var(--color-neutral-700);"></div>
            <button class="btn btn-outline btn-full" onclick="clearRoute()">Clear Route</button>
        </div>
    </main>

    <footer id="main-footer"></footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="data/campus-layouts.js"></script>
    <script src="data/tn-uni-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/pages/auth.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/pages/map.js"></script>
    <script src="js/routing.js"></script>
</body>
</html>
